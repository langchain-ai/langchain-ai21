[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "langchain-ai21"
version = "1.2.0"
description = "An integration package connecting AI21 and LangChain"
authors = []
readme = "README.md"
repository = "https://github.com/langchain-ai/langchain-ai21"
license = "MIT"

[tool.mypy]
disallow_untyped_defs = "True"

[tool.poetry.urls]
"Source Code" = "https://github.com/langchain-ai/langchain-ai21/tree/main/libs/ai21"
"Release Notes" = "https://github.com/langchain-ai/langchain-ai21/releases"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
langchain-core = ">=1.2.11,<1.3"
ai21 = "^3.3.0"
# CVE-2025-43859: h11 < 0.16.0 accepts malformed Chunked-Encoding bodies (critical).
# Transitive via httpx -> httpcore. Remove once httpcore bumps its floor.
h11 = ">=0.16.0"
# CVE-2026-21441 / CVE-2025-66471 / CVE-2025-66418: urllib3 decompression vulnerabilities (high).
# Transitive via requests/fsspec. Remove once parents bump their floor to >= 2.6.3.
urllib3 = ">=2.6.3"
# CVE-2026-1260: sentencepiece heap overflow (high).
# Transitive via ai21-tokenizer. Remove once ai21-tokenizer bumps its floor.
sentencepiece = ">=0.2.1"
# GHSA-4h44-w6fm-548g: requests .netrc credential leak via malicious URLs (medium).
# Transitive via langsmith/others. Remove once parents bump their floor to >= 2.32.4.
requests = ">=2.32.4"
# GHSA-2fvf-r6wq-7hqg / GHSA-765m-fmrp-9pjw: filelock TOCTOU symlink attacks (medium).
# Transitive via virtualenv/huggingface-hub. Remove once parents bump their floor to >= 3.20.3.
filelock = ">=3.20.3"
# GHSA-grjc-gq5x-g595: orjson unlimited recursion for deeply nested JSON (medium).
# Transitive via langgraph/langsmith. Remove once parents bump their floor to > 3.11.4.
orjson = ">=3.11.5"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--snapshot-warn-unused --strict-markers --strict-config --durations=5"
markers = [
    "requires: mark tests as requiring a specific library",
    "asyncio: mark tests as requiring asyncio",
    "compile: mark placeholder test used to compile integration tests without running them",
    "scheduled: mark tests to run in scheduled testing",
]
asyncio_mode = "auto"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.test_integration]
optional = true

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.test.dependencies]
pytest = "^7.3.0"
freezegun = "^1.2.2"
pytest-mock = "^3.10.0"
syrupy = "^4.0.2"
pytest-watcher = "^0.3.4"
pytest-asyncio = "^0.21.1"
langchain-tests = ">=1.1.0,<2"

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.0"

[tool.poetry.group.test_integration.dependencies]

[tool.poetry.group.lint.dependencies]
ruff = "^0.5"

[tool.poetry.group.typing.dependencies]
mypy = "^1.10"

[tool.poetry.group.maestro.dependencies]
langgraph = "^1.0.0"
langchain-openai = "^0.3.11"
# GHSA-3hjr-j8jq-6rph: langgraph-checkpoint < 4.0.0 deserialization RCE via BaseCache (medium).
# langgraph ^1.0 accepts >= 2.1.0,<5.0.0 but does not force 4.x; constrain explicitly.
# Remove once langgraph requires >= 4.0.0 directly.
langgraph-checkpoint = ">=4.0.0"
